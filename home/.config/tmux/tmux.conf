# fish in new panes even though the login shell stays bash
if-shell 'test -x "$HOME/.local/bin/fish"' 'set -g default-shell "$HOME/.local/bin/fish"'

set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on

# windows and panes numbered from 1, no gaps
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# vi keys in copy mode
setw -g mode-keys vi

# splits and new windows open in the current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# Catppuccin Mocha (cloned by install.sh)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-left ""
set -g status-right-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
