# Terminal tools, the same everywhere (workstation and devcontainer).
# Development toolchains (node, uv, kubectl, ...) come from the devcontainer
# image's /etc/mise/config.toml, merged with this one.
[tools]
# fish's static release build; install.sh links it at ~/.local/bin/fish
"github:fish-shell/fish-shell" = "latest"
tmux = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
neovim = "latest"
ripgrep = "latest"
starship = "latest"
zoxide = "latest"
